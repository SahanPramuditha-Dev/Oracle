[project]
name = "oracle-backend"
version = "0.1.0"
description = "Local ORACLE foundation gateway"
requires-python = ">=3.12,<3.13"
dependencies = ["pypdf==6.21.4", "fastapi==0.162.0", "uvicorn[standard]==0.54.0", "httpx==0.28.1", "python-dotenv==1.2.4", "SQLAlchemy==2.0.57", "alembic==1.20.1", "psycopg[binary]==3.3.8", "rapidocr-onnxruntime==1.4.4", "Pillow==13.0.0", "python-multipart==0.0.33", "faster-whisper==1.2.1", "pywin32==312; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
